<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Gekke Machine Werkplaats</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <script type="module" crossorigin src="./assets/index-B2r62ePI.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-C2X77Fnh.css">
</head>
<body>

<header>
  <h1>🔧 Gekke Machine Werkplaats <span class="squiggle">~*~</span></h1>
  <div class="header-right">
    <button class="btn btn-update" id="updateBtn" title="Nieuwe versie beschikbaar — klik om te herladen" hidden>🤖 Update</button>
    <div class="machine-name" id="machineName">naamloze machine</div>
  </div>
</header>

<aside class="bin">
  <h2 id="binTitle">Rommellade</h2>
  <button class="bin-arrow" id="binUp" aria-label="Omhoog">▲</button>
  <div class="bin-scroll" id="binScroll">
    <div class="bin-grid" id="binGrid"></div>
  </div>
  <button class="bin-arrow" id="binDown" aria-label="Omlaag">▼</button>
</aside>

<section class="shop" id="shop">
  <div class="world" id="world"></div>
</section>

<footer class="controls">
  <div class="count" id="count">0 onderdelen</div>
  <button class="btn btn-icon" id="mapBtn" title="Kies wereld">🗺️</button>
  <button class="btn btn-icon btn-undo" id="undoBtn" title="Ongedaan maken">↶</button>
  <button class="btn btn-icon" id="historyBtn" title="Geschiedenis">📜</button>
  <button class="btn btn-icon" id="shareBtn" title="Opslaan / Laden">💾</button>
  <button class="btn btn-icon" id="soundBtn" title="Geluid">🔊</button>
  <button class="btn btn-surprise" id="surpriseBtn">🎲 Verras me!</button>
  <button class="btn btn-clear" id="clearBtn">💥 Wissen</button>
  <button class="btn btn-run" id="runBtn">▶ START!</button>
</footer>

<aside class="history-panel" id="historyPanel">
  <header>
    <h3>📜 Geschiedenis (laatste 30)</h3>
    <button class="panel-close" id="historyClose">×</button>
  </header>
  <ul class="history-list" id="historyList"></ul>
</aside>

<div class="modal-backdrop" id="mapBackdrop" hidden>
  <div class="modal map-modal">
    <header>
      <h3>🗺️ Kies een wereld!</h3>
      <button class="panel-close" id="mapClose" hidden>×</button>
    </header>
    <div class="modal-body">
      <div class="map-grid" id="mapGrid"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal">
    <header>
      <h3>💾 Opslaan / Laden</h3>
      <button class="panel-close" id="modalClose">×</button>
    </header>
    <div class="modal-body">
      <div class="modal-section">
        <label for="exportText">Kopieer deze code om je bouwsel op te slaan:</label>
        <textarea id="exportText" readonly></textarea>
        <div class="modal-btn-row">
          <button class="btn btn-icon modal-btn" id="copyBtn">📋 Code kopiëren</button>
        </div>
      </div>
      <hr/>
      <div class="modal-section">
        <label for="importText">Plak hier een code om te laden:</label>
        <textarea id="importText" placeholder="plak hier je code..."></textarea>
        <div class="modal-btn-row">
          <button class="btn btn-surprise modal-btn" id="loadBtn">✨ Laden!</button>
        </div>
        <div class="modal-msg" id="loadMsg"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
