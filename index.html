<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Gekke Machine Werkplaats</title>
<style>
  :root {
    --paper: #f4ead5;
    --paper-2: #ebdfc1;
    --ink: #2a2118;
    --accent: #ef4444;
    --accent-2: #f59e0b;
    --good: #10b981;
    --shadow: 0 4px 0 rgba(0,0,0,.18);
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  body {
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 64px 1fr 84px;
    grid-template-areas:
      "header header"
      "bin    shop"
      "bin    controls";
  }
  @media (max-width: 700px) {
    body { grid-template-columns: 200px 1fr; }
  }
  header {
    grid-area: header;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
    background: #2a2118;
    color: #fff8e7;
    border-bottom: 4px solid #1a140d;
  }
  header h1 {
    margin: 0; font-size: 22px; letter-spacing: .5px;
    text-shadow: 2px 2px 0 #000;
  }
  header h1 .squiggle { color: #fbbf24; }
  header .machine-name {
    font-size: 14px;
    background: #1a140d;
    border: 2px dashed #5b4a33;
    padding: 4px 12px;
    border-radius: 999px;
    min-width: 240px; text-align: center;
    color: #fbbf24;
  }
  @media (max-width: 700px) {
    header .machine-name { display: none; }
  }

  /* Parts bin */
  .bin {
    grid-area: bin;
    background: var(--paper-2);
    border-right: 4px solid #c9b88c;
    padding: 10px 8px;
    overflow: hidden;
    display: flex; flex-direction: column;
    touch-action: pan-y;
  }
  .bin h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: #6b5a3e; margin: 4px 0 6px 4px;
    flex-shrink: 0;
  }
  .bin-scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding: 4px 2px;
    scroll-behavior: smooth;
  }
  .bin-scroll::-webkit-scrollbar { width: 6px; }
  .bin-scroll::-webkit-scrollbar-thumb { background: #c9b88c; border-radius: 3px; }
  .bin-arrow {
    flex-shrink: 0;
    background: #6b5a3e;
    color: #fff8e7;
    border: 3px solid #2a2118;
    border-radius: 12px;
    box-shadow: 0 3px 0 #2a2118;
    font-size: 22px; font-weight: bold;
    line-height: 1; padding: 6px 0;
    margin: 4px 4px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .bin-arrow:hover { background: #78350f; }
  .bin-arrow:active { transform: translateY(2px); box-shadow: 0 1px 0 #2a2118; }
  .bin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .bin-item {
    aspect-ratio: 1;
    background: #fff8e7;
    border: 2px solid #2a2118;
    border-radius: 12px;
    box-shadow: var(--shadow);
    display: grid; place-items: center;
    cursor: grab;
    position: relative;
    transition: transform .12s ease;
    touch-action: none;
  }
  .bin-item:hover { transform: translateY(-2px) rotate(-2deg); }
  .bin-item:active { cursor: grabbing; }
  .bin-item svg { width: 70%; height: 70%; pointer-events: none; }
  .bin-item .label {
    position: absolute; bottom: -2px; left: 0; right: 0;
    text-align: center; font-size: 10px; color: #6b5a3e;
    pointer-events: none;
  }
  .bin-item.danger { border-color: #dc2626; box-shadow: 0 4px 0 #7f1d1d, 0 0 8px rgba(220,38,38,.3); }

  /* Workshop */
  .shop {
    grid-area: shop;
    position: relative;
    overflow: hidden;
    background: #0006;
    touch-action: none;
    cursor: grab;
  }
  .shop.panning { cursor: grabbing; }
  .shop-controls {
    position: absolute;
    right: 10px; bottom: 10px;
    display: flex; align-items: end; gap: 8px;
    z-index: 60;
    pointer-events: none;
  }
  .pan-pad {
    display: grid;
    grid-template-columns: repeat(3, 38px);
    grid-template-rows: repeat(3, 38px);
    gap: 4px;
    pointer-events: none;
  }
  .pan-pad #panUp     { grid-column: 2; grid-row: 1; }
  .pan-pad #panLeft   { grid-column: 1; grid-row: 2; }
  .pan-pad #panCenter { grid-column: 2; grid-row: 2; }
  .pan-pad #panRight  { grid-column: 3; grid-row: 2; }
  .pan-pad #panDown   { grid-column: 2; grid-row: 3; }
  .zoom-pad {
    display: flex; flex-direction: column; gap: 4px;
    pointer-events: none;
  }
  .shop-btn {
    pointer-events: auto;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(42,33,24,.85);
    color: #fff8e7;
    border: 2px solid #1a140d;
    box-shadow: 0 3px 0 rgba(0,0,0,.4);
    font-size: 16px; font-weight: bold;
    cursor: pointer;
    display: grid; place-items: center;
    line-height: 1; padding: 0;
    touch-action: manipulation;
  }
  .shop-btn:hover { background: #5b4a33; }
  .shop-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
  .world {
    position: absolute;
    top: 0; left: 0;
    width: 3000px; height: 2000px;
    background-color: var(--world-bg, var(--paper));
    background-image: var(--world-pattern,
      linear-gradient(rgba(120,90,40,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,90,40,.07) 1px, transparent 1px));
    background-size: var(--world-pattern-size, 24px 24px);
    transform-origin: 0 0;
    will-change: transform;
  }
  .shop .hint {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: #a08866; font-size: 22px; pointer-events: none;
    transition: opacity .3s;
    text-align: center; padding: 0 40px;
  }
  .shop.has-parts .hint { opacity: 0; }

  .part {
    position: absolute;
    width: 90px; height: 90px;
    cursor: grab;
    touch-action: none;
    z-index: 2;
    transition: filter .15s;
    will-change: transform;
  }
  .part:hover { filter: drop-shadow(0 0 4px #fbbf24); }
  .part.dragging { cursor: grabbing; z-index: 999; filter: drop-shadow(0 6px 4px rgba(0,0,0,.3)); }
  .part .core { width: 100%; height: 100%; display: block; }
  .part .del {
    position: absolute; top: -10px; right: -10px;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: white;
    border: 3px solid white; font-weight: bold; font-size: 18px;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 2px 4px rgba(0,0,0,.3);
    line-height: 1; z-index: 3;
  }
  body.running .part .del { display: none !important; }
  body.running .part { cursor: default; }
  body.running .bin-item { opacity: .4; pointer-events: none; }
  body.running .part[data-kind="marble"] { z-index: 50; }

  /* Controls */
  .controls {
    grid-area: controls;
    background: #2a2118;
    border-top: 4px solid #1a140d;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 12px;
    overflow-x: auto;
    touch-action: pan-x;
  }
  .btn {
    font-family: inherit;
    font-weight: bold;
    border-radius: 14px;
    border: 3px solid #1a140d;
    box-shadow: 0 4px 0 #1a140d;
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
    color: white;
    white-space: nowrap;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1a140d; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-run { background: var(--good); font-size: 26px; padding: 14px 36px; }
  .btn-run.is-running { background: var(--accent); }
  .btn-clear { background: var(--accent-2); font-size: 18px; padding: 12px 22px; }
  .btn-surprise { background: #ec4899; font-size: 18px; padding: 12px 22px; }
  .btn-icon {
    background: #6366f1;
    font-size: 18px; padding: 10px 12px;
    min-width: 44px; min-height: 44px;
    display: inline-grid; place-items: center;
  }
  .btn-undo { background: #14b8a6; }
  .count {
    color: #fbbf24; font-size: 13px; margin-right: auto;
    flex-shrink: 0;
  }
  @media (max-width: 700px) {
    .count { display: none; }
    .btn-run { font-size: 22px; padding: 12px 24px; }
    .btn-clear, .btn-surprise { font-size: 14px; padding: 10px 14px; }
  }

  /* History panel */
  .history-panel {
    position: fixed;
    right: -340px; top: 64px; bottom: 84px;
    width: 320px;
    background: var(--paper-2);
    border-left: 4px solid #c9b88c;
    transition: right .3s ease;
    z-index: 200;
    display: flex; flex-direction: column;
    box-shadow: -6px 0 20px rgba(0,0,0,.2);
    touch-action: auto;
  }
  .history-panel.open { right: 0; }
  .history-panel > header {
    background: #2a2118; color: #fff8e7;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 4px solid #1a140d;
  }
  .history-panel > header h3 { margin: 0; font-size: 16px; color: #fbbf24; }
  .panel-close {
    background: var(--accent); color: white;
    border: 2px solid white; border-radius: 50%;
    width: 30px; height: 30px; font-size: 18px; font-weight: bold;
    cursor: pointer; padding: 0;
    display: grid; place-items: center; line-height: 1;
    touch-action: manipulation;
  }
  .history-list {
    list-style: none; padding: 8px; margin: 0;
    overflow-y: auto; flex: 1;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
  .history-list li {
    background: #fff8e7;
    border: 2px solid #2a2118;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: transform .1s, background .1s;
    display: flex; justify-content: space-between; align-items: center;
    touch-action: manipulation;
  }
  .history-list li:hover { background: #fde68a; transform: translateX(-2px); }
  .history-list li .step { font-weight: bold; color: #2a2118; }
  .history-list li .info { font-size: 11px; color: #6b5a3e; }
  .history-list .empty {
    text-align: center; color: #a08866; padding: 30px 10px;
    font-size: 14px;
  }

  /* Share/Save modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(42, 33, 24, 0.7);
    display: grid; place-items: center;
    z-index: 1000;
    touch-action: auto;
    padding: 12px;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--paper);
    border: 4px solid #2a2118;
    border-radius: 18px;
    width: min(520px, 100%);
    max-height: 92vh;
    display: flex; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .modal > header {
    background: #2a2118; color: #fff8e7;
    padding: 12px 18px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal > header h3 { margin: 0; color: #fbbf24; font-size: 18px; }
  .modal-body {
    padding: 16px;
    overflow-y: auto;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
  .modal-section { margin-bottom: 16px; }
  .modal-section label {
    display: block; font-size: 14px; color: #6b5a3e;
    margin-bottom: 6px; font-weight: bold;
  }
  .modal textarea {
    width: 100%;
    min-height: 70px;
    border: 2px solid #c9b88c;
    border-radius: 8px;
    padding: 10px;
    font-family: monospace;
    font-size: 12px;
    resize: vertical;
    touch-action: auto;
    user-select: text;
    -webkit-user-select: text;
    background: #fff8e7;
    color: #2a2118;
  }
  .modal-btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .modal-btn {
    font-size: 14px; padding: 10px 16px;
  }
  .modal-msg {
    margin-top: 10px; font-size: 13px;
    min-height: 18px;
  }
  .modal-msg.success { color: #16a34a; font-weight: bold; }
  .modal-msg.error { color: #dc2626; font-weight: bold; }
  .modal hr {
    border: none; border-top: 2px dashed #c9b88c;
    margin: 16px 0;
  }

  /* Map select */
  .map-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (min-width: 520px) {
    .map-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .map-card {
    background: #fff8e7;
    border: 3px solid #2a2118;
    border-radius: 14px;
    box-shadow: 0 4px 0 #c9b88c;
    padding: 14px 8px;
    text-align: center;
    cursor: pointer;
    font-size: 14px; font-weight: bold;
    transition: transform .1s, box-shadow .1s;
    touch-action: manipulation;
  }
  .map-card:hover { transform: translateY(-2px) rotate(-1deg); }
  .map-card:active { transform: translateY(2px); box-shadow: 0 1px 0 #c9b88c; }
  .map-card .emoji { font-size: 38px; display: block; margin-bottom: 4px; line-height: 1; }
  .map-card .swatch {
    display: block;
    height: 36px;
    margin: 6px -2px 0;
    border: 2px solid #2a2118;
    border-radius: 8px;
  }

  /* Dinosaur is bigger than other parts */
  .part[data-kind="dino"] .core {
    transform: scale(1.55);
    transform-origin: 50% 50%;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.3));
  }
  .part[data-kind="dinoEgg"].hatching .core {
    animation: shake .12s linear infinite !important;
  }

  /* Theme decorations (non-interactive scenery on the world) */
  .deco {
    position: absolute;
    pointer-events: none;
    opacity: .55;
    z-index: 0;
  }
  .deco svg { width: 100%; height: 100%; display: block; }
  @keyframes drift {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-6px); }
  }
  .deco.drifty { animation: drift 4s ease-in-out infinite; }
  .deco.twinkle { animation: glow 2s ease-in-out infinite; }

  /* Animations */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }
  @keyframes bounce-y {
    0%,100% { transform: translateY(0) scaleY(1); }
    25%     { transform: translateY(-14px) scaleY(.85); }
    50%     { transform: translateY(0) scaleY(1.1); }
    75%     { transform: translateY(-6px) scaleY(.95); }
  }
  @keyframes wiggle {
    0%,100% { transform: rotate(-8deg); }
    50%     { transform: rotate(8deg); }
  }
  @keyframes flip {
    0%,100% { transform: rotate(0); }
    50%     { transform: rotate(180deg); }
  }
  @keyframes shake {
    0%,100% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-3px,2px) rotate(-3deg); }
    40% { transform: translate(3px,-1px) rotate(2deg); }
    60% { transform: translate(-2px,-2px) rotate(-1deg); }
    80% { transform: translate(2px,1px) rotate(2deg); }
  }
  @keyframes glow {
    0%,100% { filter: drop-shadow(0 0 0 #fff) brightness(1); }
    50%     { filter: drop-shadow(0 0 18px #fde047) brightness(1.4); }
  }
  @keyframes drive {
    0%,100% { transform: translateX(-30px); }
    50%     { transform: translateX(30px); }
  }
  @keyframes bounce-drive {
    0%   { transform: translate(-30px, 0) rotate(-3deg); }
    25%  { transform: translate(-15px, -22px) rotate(4deg); }
    50%  { transform: translate(30px, 0) rotate(3deg); }
    75%  { transform: translate(15px, -22px) rotate(-4deg); }
    100% { transform: translate(-30px, 0) rotate(-3deg); }
  }
  @keyframes wave {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50%     { transform: translateY(-8px) rotate(4deg); }
  }
  @keyframes stretch {
    0%,100% { transform: scaleY(1) scaleX(1); }
    50%     { transform: scaleY(1.3) scaleX(.85); }
  }
  @keyframes roll {
    0%   { transform: translateX(-50px) rotate(0deg); }
    50%  { transform: translateX(50px)  rotate(360deg); }
    100% { transform: translateX(-50px) rotate(0deg); }
  }
  @keyframes bubble {
    0%,100% { transform: scale(1) translateY(0); filter: brightness(1); }
    50%     { transform: scale(1.05) translateY(-2px); filter: brightness(1.3); }
  }
  @keyframes rumble {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, 2px); }
  }
  @keyframes train-ride {
    0%   { offset-distance: 0%; }
    100% { offset-distance: 100%; }
  }

  .active.anim-spin     .core { animation: spin 1.5s linear infinite; transform-origin: 50% 50%; }
  .active.anim-spinfast .core { animation: spin .35s linear infinite; transform-origin: 50% 50%; }
  .active.anim-spinrev  .core { animation: spin-rev 2s linear infinite; transform-origin: 50% 50%; }
  .active.anim-bounce   .core { animation: bounce-y .6s ease-in-out infinite; transform-origin: 50% 100%; }
  .active.anim-wiggle   .core { animation: wiggle .4s ease-in-out infinite; transform-origin: 50% 50%; }
  .active.anim-flip     .core { animation: flip 1s ease-in-out infinite; transform-origin: 50% 70%; }
  .active.anim-shake    .core { animation: shake .15s linear infinite; transform-origin: 50% 50%; }
  .active.anim-glow     .core { animation: glow .9s ease-in-out infinite; }
  .active.anim-drive    .core { animation: drive 2s ease-in-out infinite; }
  .active.anim-bouncedrive .core { animation: bounce-drive .9s ease-in-out infinite; transform-origin: 50% 100%; }
  .active.anim-wave     .core { animation: wave .7s ease-in-out infinite; transform-origin: 50% 100%; }
  .active.anim-stretch  .core { animation: stretch .5s ease-in-out infinite; transform-origin: 50% 100%; }
  .active.anim-roll     .core { animation: roll 2.4s ease-in-out infinite; transform-origin: 50% 50%; }
  .active.anim-bubble   .core { animation: bubble 1s ease-in-out infinite; }
  .active.anim-rumble   .core { animation: rumble .12s linear infinite; }

  body.running header h1 .squiggle { animation: wiggle .2s infinite; display: inline-block; }

  @keyframes hitpop {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.25); filter: brightness(1.6) drop-shadow(0 0 10px #fde047); }
    100% { transform: scale(1); }
  }
  .part.hit .core { animation: hitpop .25s ease-out !important; }

  .part[data-kind="mouse"].empowered {
    filter: drop-shadow(0 0 14px #f0abfc) drop-shadow(0 0 24px #ec4899);
    z-index: 70;
  }
  .part[data-kind="mouse"].empowered .core {
    transform: scale(1.55);
    transform-origin: 50% 60%;
    filter: hue-rotate(280deg) saturate(2.2) brightness(1.1);
  }
  @keyframes mouse-run {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-4px); }
  }
  .active[data-kind="mouse"] .core { animation: mouse-run .18s ease-in-out infinite; }

  /* Confetti */
  .confetti {
    position: absolute; width: 8px; height: 8px;
    pointer-events: none;
    border-radius: 2px;
  }
  .particle {
    position: absolute; width: 8px; height: 8px;
    pointer-events: none;
    border-radius: 50%;
    z-index: 100;
    margin-left: -4px; margin-top: -4px;
  }
  .fireball {
    position: absolute;
    width: 28px; height: 28px;
    background: radial-gradient(circle, #fef3c7, #fbbf24 30%, #dc2626 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 60;
    box-shadow: 0 0 12px #f59e0b, 0 0 24px rgba(220,38,38,.6);
    margin-left: -14px; margin-top: -14px;
  }
</style>
</head>
<body>

<header>
  <h1>🔧 Gekke Machine Werkplaats <span class="squiggle">~*~</span></h1>
  <div class="machine-name" id="machineName">naamloze machine</div>
</header>

<aside class="bin">
  <h2 id="binTitle">Rommellade</h2>
  <button class="bin-arrow" id="binUp" aria-label="Omhoog">▲</button>
  <div class="bin-scroll" id="binScroll">
    <div class="bin-grid" id="binGrid"></div>
  </div>
  <button class="bin-arrow" id="binDown" aria-label="Omlaag">▼</button>
</aside>

<section class="shop" id="shop">
  <div class="world" id="world"></div>
  <div class="hint" id="hint">← tik op een dingetje om het toe te voegen!<br><small style="font-size:14px">leg een knikker en druk op START ✨ &middot; sleep lege ruimte om te slepen</small></div>
  <div class="shop-controls" id="shopControls">
    <div class="pan-pad">
      <button class="shop-btn" id="panUp" aria-label="Omhoog">▲</button>
      <button class="shop-btn" id="panLeft" aria-label="Links">◄</button>
      <button class="shop-btn" id="panCenter" aria-label="Midden">⊙</button>
      <button class="shop-btn" id="panRight" aria-label="Rechts">►</button>
      <button class="shop-btn" id="panDown" aria-label="Omlaag">▼</button>
    </div>
    <div class="zoom-pad">
      <button class="shop-btn" id="zoomIn" aria-label="Inzoomen">＋</button>
      <button class="shop-btn" id="zoomOut" aria-label="Uitzoomen">－</button>
    </div>
  </div>
</section>

<footer class="controls">

// ============================================================================
// AUDIO
// ============================================================================
let audioCtx = null;
let soundOn = true;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone({ freq = 440, type = "sine", dur = 0.2, vol = 0.15, slide = 0, delay = 0 }) {
  if (!soundOn) return;
  const ctx = ac();
  const t0 = ctx.currentTime + delay;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise({ dur = 0.2, vol = 0.1, delay = 0, filter = 800 }) {
  if (!soundOn) return;
  const ctx = ac();
  const t0 = ctx.currentTime + delay;
  const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = filter;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(ctx.destination);
  src.start(t0); src.stop(t0 + dur + 0.02);
}
const VOICES = {
  whirr:  d => { for (let i = 0; i < 6; i++) tone({ freq: 220 + Math.random()*40, type:"sawtooth", dur:.4, vol:.04, delay: d + i*.4 }); },
  boing:  d => tone({ freq: 600, type:"sine", dur:.3, vol:.2, slide: -400, delay: d }),
  buzz:   d => tone({ freq: 90, type:"square", dur:1.5, vol:.05, delay: d }),
  whisk:  d => noise({ dur: 1.5, vol: .07, filter: 2000, delay: d }),
  flap:   d => { tone({ freq: 200, type:"triangle", dur:.1, vol:.15, delay: d }); tone({ freq: 160, type:"triangle", dur:.1, vol:.15, delay: d+.5 }); },
  thud:   d => { for (let i = 0; i < 4; i++) noise({ dur:.1, vol:.12, filter:200, delay: d + i*.3 }); },
  ping:   d => tone({ freq: 1320, type:"sine", dur:.4, vol:.1, delay: d }),
  chug:   d => { for (let i = 0; i < 8; i++) tone({ freq: 110, type:"square", dur:.08, vol:.1, delay: d + i*.18 }); },
  click:  d => { for (let i = 0; i < 5; i++) tone({ freq: 1800, type:"square", dur:.02, vol:.08, delay: d + i*.3 }); },
  vroom:  d => tone({ freq: 180, type:"sawtooth", dur:1.2, vol:.08, slide: 60, delay: d }),
  windy:  d => noise({ dur: 2, vol: .06, filter: 500, delay: d }),
  twang:  d => tone({ freq: 300, type:"triangle", dur:.4, vol:.15, slide: -100, delay: d }),
  plink:  d => tone({ freq: 1500, type:"sine", dur:.1, vol:.12, slide: -400, delay: d }),
  sizzle: d => { noise({ dur:.5, vol:.12, filter: 3500, delay: d }); tone({ freq: 220, type:"sawtooth", dur:.3, vol:.08, slide:-100, delay: d }); },
  boom:   d => { noise({ dur:.5, vol:.18, filter: 180, delay: d }); tone({ freq: 90, type:"sawtooth", dur:.4, vol:.14, slide:-50, delay: d }); },
  beep:   d => { tone({ freq: 880, type:"square", dur:.06, vol:.1, delay: d }); tone({ freq: 660, type:"square", dur:.06, vol:.1, delay: d+.1 }); tone({ freq: 990, type:"square", dur:.08, vol:.1, delay: d+.2 }); },
  squeak: d => { tone({ freq: 2400, type:"sine", dur:.07, vol:.09, slide:-500, delay: d }); tone({ freq: 2000, type:"sine", dur:.07, vol:.09, slide:-500, delay: d+.09 }); },
  munch:  d => { for (let i = 0; i < 3; i++) noise({ dur:.06, vol:.1, filter: 700, delay: d + i*.1 }); }
};

// STATE

const shop = document.getElementById("shop");
const world = document.getElementById("world");
const WORLD_W = 3000, WORLD_H = 2000;
let worldX = 0, worldY = 0;
let worldScale = 0.7;
let nextId = 1;
let dragging = null;
let dragOffset = { x: 0, y: 0 };

function setWorldTransform() {
  world.style.transform = `translate(${worldX}px, ${worldY}px) scale(${worldScale})`;
}
function clampWorld() {
  const sr = shop.getBoundingClientRect();
  const minX = Math.min(0, sr.width  - WORLD_W * worldScale);
  const minY = Math.min(0, sr.height - WORLD_H * worldScale);
  worldX = Math.min(0, Math.max(minX, worldX));
  worldY = Math.min(0, Math.max(minY, worldY));
}
function zoomBy(factor) {
  const sr = shop.getBoundingClientRect();
  const cx = sr.width / 2, cy = sr.height / 2;
  // world coord under viewport center
  const wcX = (cx - worldX) / worldScale;
  const wcY = (cy - worldY) / worldScale;
  worldScale = Math.max(0.4, Math.min(1.8, worldScale * factor));
  worldX = cx - wcX * worldScale;
  worldY = cy - wcY * worldScale;
  clampWorld();
  setWorldTransform();
}
function panBy(dx, dy) {
  worldX += dx;
  worldY += dy;
  clampWorld();
  setWorldTransform();
}
setWorldTransform();

// ============================================================================
// SPAWN & DRAG (coords are shop-local top-left)
// ============================================================================
function spawnPartLocal(kind, localX, localY, opts = {}) {
  const p = PARTS[kind];
  const el = document.createElement("div");
  const id = nextId++;
  el.className = "part " + (p.anim || "");
  el.dataset.kind = kind;
  el.dataset.id = id;
  el.innerHTML = p.svg + `<div class="del" title="remove">×</div>`;

  if (p.custom === "brio") {
    const train = document.createElement("div");
    train.style.cssText = `
      position:absolute; left:0; top:0; width:16px; height:12px;
      background:#dc2626; border:2px solid #2a2118; border-radius:3px;
      offset-path: path('M 8 60 Q 45 5, 80 60');
      animation: none; opacity: 0;`;
    train.dataset.train = "1";
    el.appendChild(train);
  }

  positionLocal(el, localX, localY);
  world.appendChild(el);
  attachPartHandlers(el);
  updateCount();
  if (!opts.silent) saveAndPush();
  return el;
}

function positionLocal(el, localX, localY) {
  const w = 90, h = 90;
  const cx = Math.max(0, Math.min(WORLD_W - w, localX));
  const cy = Math.max(0, Math.min(WORLD_H - h, localY));
  el.style.left = cx + "px";
  el.style.top  = cy + "px";
}

function spawnPartFromClient(kind, clientX, clientY) {
  const wr = world.getBoundingClientRect();
  spawnPartLocal(kind, (clientX - wr.left) / worldScale - 45, (clientY - wr.top) / worldScale - 45);
}

function attachPartHandlers(el) {
  el.addEventListener("pointerdown", (e) => {
    if (e.target.classList.contains("del")) {
      if (document.body.classList.contains("running")) return;
      deletePart(el);
      return;
    }
    if (document.body.classList.contains("running")) return;
    dragging = el;
    el.classList.add("dragging");
    const r = el.getBoundingClientRect();
    dragOffset = { x: e.clientX - r.left - 45, y: e.clientY - r.top - 45 };
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  el.addEventListener("pointermove", (e) => {
    if (dragging === el) {
      const wr = world.getBoundingClientRect();
      positionLocal(el,
        (e.clientX - wr.left) / worldScale - dragOffset.x - 45,
        (e.clientY - wr.top)  / worldScale - dragOffset.y - 45);
    }
  });
  const release = () => {
    if (dragging === el) {
      el.classList.remove("dragging");
      dragging = null;
      saveAndPush();
    }
  };
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
}

function deletePart(el) {
  el.remove();
  updateCount();
  saveAndPush();
}

function spawnInShopRandom(kind) {
  const sr = shop.getBoundingClientRect();
  // spawn within the currently-visible portion of the world (account for scale)
  const vx0 = -worldX / worldScale;
  const vy0 = -worldY / worldScale;
  const vw  = sr.width  / worldScale;
  const vh  = sr.height / worldScale;
  const localX = vx0 + vw * (0.25 + Math.random() * 0.5) - 45;
  const localY = vy0 + vh * (0.25 + Math.random() * 0.5) - 45;
  spawnPartLocal(kind, localX, localY);
}

document.querySelectorAll(".bin-item").forEach(item => {
  let didDrag = false;
  let startX = 0, startY = 0;
  item.addEventListener("pointerdown", (e) => {
    if (document.body.classList.contains("running")) return;
    didDrag = false;
    startX = e.clientX; startY = e.clientY;
    const kind = item.dataset.kind;
    e.preventDefault();

    const ghost = document.createElement("div");
    ghost.className = "part";
    ghost.style.cssText = `position:fixed; pointer-events:none; left:${e.clientX-45}px; top:${e.clientY-45}px; opacity:0; z-index:9999;`;
    ghost.innerHTML = PARTS[kind].svg;
    document.body.appendChild(ghost);

    const move = (ev) => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!didDrag && (dx*dx + dy*dy) > 36) {
        didDrag = true;
        ghost.style.opacity = "1";
        ghost.classList.add("dragging");
      }
      ghost.style.left = (ev.clientX - 45) + "px";
      ghost.style.top  = (ev.clientY - 45) + "px";
    };
    const up = (ev) => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      ghost.remove();
      const sr = shop.getBoundingClientRect();
      const inside = ev.clientX >= sr.left && ev.clientX <= sr.right
                  && ev.clientY >= sr.top  && ev.clientY <= sr.bottom;
      if (didDrag && inside)      spawnPartFromClient(kind, ev.clientX, ev.clientY);
      else if (!didDrag)          spawnInShopRandom(kind);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  });
});

// --- Pan the world ---
let panActive = false, panStartX = 0, panStartY = 0, panStartWX = 0, panStartWY = 0, panPointerId = null;
shop.addEventListener("pointerdown", (e) => {
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  if (e.target.closest(".part")) return;
  panActive = true;
  panPointerId = e.pointerId;
  panStartX = e.clientX; panStartY = e.clientY;
  panStartWX = worldX;   panStartWY = worldY;
  shop.classList.add("panning");
  try { shop.setPointerCapture(e.pointerId); } catch (_) {}
});
shop.addEventListener("pointermove", (e) => {
  if (!panActive || e.pointerId !== panPointerId) return;
  worldX = panStartWX + (e.clientX - panStartX);
  worldY = panStartWY + (e.clientY - panStartY);
  clampWorld();
  setWorldTransform();
});
const endPan = (e) => {
  if (!panActive) return;
  if (e && e.pointerId !== panPointerId) return;
  panActive = false; panPointerId = null;
  shop.classList.remove("panning");
};
shop.addEventListener("pointerup", endPan);
shop.addEventListener("pointercancel", endPan);
window.addEventListener("resize", () => { clampWorld(); setWorldTransform(); });

// ============================================================================
// PHYSICS — marbles, fireballs, lava, volcano
// ============================================================================
let physicsHandle = null;
let lastFrame = 0;
let marbles   = []; // { el, x, y, vx, vy, origX, origY }
let fireballs = []; // { el, x, y, vx, vy, life }
const volcanoNext = new Map(); // partId -> next-eruption timestamp
const robotState = new Map(); // partId -> { phase, nextAt, targetEl, fromX, fromY, toX, toY, animStart, animDur }
const mouseState = new Map(); // partId -> { vx, vy, dirTimer, empoweredUntil }
const eggState   = new Map(); // partId -> { hatchAt }
const dinoState  = new Map(); // partId -> { vx, vy, dirTimer }
const EMPOWER_MS = 15000;

const PART_RADIUS   = 42;
const MARBLE_RADIUS = 30;
const FIREBALL_RADIUS = 14;
const GRAVITY  = 0.5;
const FRICTION = 0.995;

function startPhysics() {
  marbles.length = 0;
  fireballs.length = 0;
  volcanoNext.clear();
  robotState.clear();
  mouseState.clear();
  eggState.clear();
  dinoState.clear();
  shop.querySelectorAll('.part.empowered').forEach(el => el.classList.remove('empowered'));
  shop.querySelectorAll('.part.hatching').forEach(el => el.classList.remove('hatching'));

  shop.querySelectorAll('.part[data-kind="marble"]').forEach(el => {
    const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
    marbles.push({
      el, x, y,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() - 0.5) * 2,
      origX: x, origY: y
    });
  });

  // Always run physics if any active critter / volcano is present, or marbles.
  const hasVolcano = !!shop.querySelector('.part[data-kind="volcano"]');
  const hasRobot   = !!shop.querySelector('.part[data-kind="robot"]');
  const hasMouse   = !!shop.querySelector('.part[data-kind="mouse"]');
  const hasEgg     = !!shop.querySelector('.part[data-kind="dinoEgg"]');
  const hasDino    = !!shop.querySelector('.part[data-kind="dino"]');
  if (!marbles.length && !hasVolcano && !hasRobot && !hasMouse && !hasEgg && !hasDino) return;

  lastFrame = performance.now();
  physicsHandle = requestAnimationFrame(physicsLoop);
}

function stopPhysics() {
  if (physicsHandle) cancelAnimationFrame(physicsHandle);
  physicsHandle = null;
  marbles.length = 0;
  fireballs.forEach(f => f.el.remove());
  fireballs.length = 0;
  volcanoNext.clear();
  robotState.clear();
  mouseState.clear();
  eggState.clear();
  dinoState.clear();
  shop.querySelectorAll('.part[data-grabbed]').forEach(el => delete el.dataset.grabbed);
  shop.querySelectorAll('.part.empowered').forEach(el => el.classList.remove('empowered'));
  shop.querySelectorAll('.part.hatching').forEach(el => el.classList.remove('hatching'));
}

function physicsLoop(now) {
  const dt = Math.min(2, (now - lastFrame) / 16);
  lastFrame = now;
  const W = WORLD_W, H = WORLD_H;

  const partEls = [...shop.querySelectorAll('.part:not([data-kind="marble"])')];
  const obstacles = partEls.map(el => {
    const x = parseFloat(el.style.left) || 0;
    const y = parseFloat(el.style.top)  || 0;
    return {
      el, kind: el.dataset.kind,
      cx: x + 45, cy: y + 45,
      def: PARTS[el.dataset.kind]
    };
  });

  // --- Volcano eruptions ---
  obstacles.filter(o => o.def.erupts).forEach(v => {
    const id = v.el.dataset.id;
    const next = volcanoNext.get(id);
    if (next == null) {
      volcanoNext.set(id, now + 800 + Math.random() * 1200);
    } else if (now >= next) {
      eruptVolcano(v);
      volcanoNext.set(id, now + 2200 + Math.random() * 1800);
    }
  });

  // --- Dino eggs: hatch on a timer ---
  const eggEls = [...shop.querySelectorAll('.part[data-kind="dinoEgg"]')];
  eggEls.forEach(el => {
    const id = el.dataset.id;
    let es = eggState.get(id);
    if (!es) {
      es = { hatchAt: now + 6000 + Math.random() * 10000 };
      eggState.set(id, es);
    }
    if (!el.classList.contains('hatching') && now > es.hatchAt - 2000) {
      el.classList.add('hatching');
    }
    if (now >= es.hatchAt) {
      const x = parseFloat(el.style.left) || 0;
      const y = parseFloat(el.style.top)  || 0;
      particleBurst(x + 45, y + 45, ['#fde047','#fbbf24','#22c55e','#fff']);
      VOICES.boom(0);
      VOICES.squeak(0.12);
      el.animate(
        [{ transform: 'scale(1) rotate(0)', opacity: 1 },
         { transform: 'scale(1.4) rotate(120deg)', opacity: 0 }],
        { duration: 320, easing: 'ease-out' }
      ).onfinish = () => el.remove();
      eggState.delete(id);
      const dino = spawnPartLocal('dino', x, y, { silent: true });
      dino.classList.add('active');
    }
  });

  // --- Dinosaurs: stomp around and eat everything ---
  const dinoEls = [...shop.querySelectorAll('.part[data-kind="dino"]')];
  dinoEls.forEach(el => {
    const id = el.dataset.id;
    let ds = dinoState.get(id);
    if (!ds) {
      ds = { vx: 0, vy: 0, dirTimer: 0 };
      dinoState.set(id, ds);
    }
    const dx = parseFloat(el.style.left) || 0;
    const dy = parseFloat(el.style.top)  || 0;
    const dcx = dx + 45, dcy = dy + 45;

    const prey = [...shop.querySelectorAll('.part')].filter(p =>
      p !== el && p.dataset.kind !== 'dino' && p.isConnected
    );

    let target = null;
    if (prey.length) {
      let bestD = Infinity;
      prey.forEach(p => {
        const px = (parseFloat(p.style.left) || 0) + 45;
        const py = (parseFloat(p.style.top)  || 0) + 45;
        const d = Math.hypot(px - dcx, py - dcy);
        if (d < bestD) { bestD = d; target = { el: p, x: px, y: py, d }; }
      });
    }

    if (target) {
      const dirX = target.x - dcx, dirY = target.y - dcy;
      const len = Math.hypot(dirX, dirY) || 1;
      ds.vx = (dirX / len) * 1.7;
      ds.vy = (dirY / len) * 1.7;
      if (target.d < 70) {
        // CHOMP
        particleBurst(target.x, target.y, ['#16a34a','#fbbf24','#dc2626','#fff','#86efac']);
        VOICES.boom(0);
        VOICES.munch(0.05);
        target.el.animate(
          [{ transform: 'scale(1)', opacity: 1 },
           { transform: 'scale(.3) rotate(160deg)', opacity: 0 }],
          { duration: 260, easing: 'ease-out' }
        ).onfinish = () => target.el.remove();
        const tid = target.el.dataset.id;
        mouseState.delete(tid);
        robotState.delete(tid);
        eggState.delete(tid);
        const marbleIdx = marbles.findIndex(m => m.el === target.el);
        if (marbleIdx >= 0) marbles[marbleIdx]._dead = true;
      }
    } else {
      ds.dirTimer -= dt;
      if (ds.dirTimer <= 0) {
        const a = Math.random() * Math.PI * 2;
        ds.vx = Math.cos(a) * 1.0;
        ds.vy = Math.sin(a) * 1.0;
        ds.dirTimer = 50 + Math.random() * 80;
      }
    }

    let nx = dx + ds.vx * dt;
    let ny = dy + ds.vy * dt;
    if (nx < 0)        { nx = 0;        ds.vx = Math.abs(ds.vx);  ds.dirTimer = 0; }
    if (nx > W - 90)   { nx = W - 90;   ds.vx = -Math.abs(ds.vx); ds.dirTimer = 0; }
    if (ny < 0)        { ny = 0;        ds.vy = Math.abs(ds.vy);  ds.dirTimer = 0; }
    if (ny > H - 90)   { ny = H - 90;   ds.vy = -Math.abs(ds.vy); ds.dirTimer = 0; }
    el.style.left = nx + 'px';
    el.style.top  = ny + 'px';
  });
  const liveDinoIds = new Set(dinoEls.map(d => d.dataset.id));
  for (const id of dinoState.keys()) if (!liveDinoIds.has(id)) dinoState.delete(id);
  const liveEggIds = new Set(eggEls.map(e => e.dataset.id));
  for (const id of eggState.keys()) if (!liveEggIds.has(id)) eggState.delete(id);

  // --- Mice: wander / flee robots / seek cheese / chase robots when empowered ---
  const mouseEls  = [...shop.querySelectorAll('.part[data-kind="mouse"]')];
  const cheeseEls = [...shop.querySelectorAll('.part[data-kind="cheese"]')];
  const robotEls  = [...shop.querySelectorAll('.part[data-kind="robot"]')];

  const liveMice = [];
  mouseEls.forEach(el => {
    const id = el.dataset.id;
    let ms = mouseState.get(id);
    if (!ms) {
      ms = { vx: 0, vy: 0, dirTimer: 0, empoweredUntil: 0 };
      mouseState.set(id, ms);
    }
    // expire empowered status
    if (ms.empoweredUntil && now >= ms.empoweredUntil) {
      ms.empoweredUntil = 0;
      el.classList.remove('empowered');
      VOICES.squeak(0);
    }
    liveMice.push({ el, ms });
  });

  const isEmpowered = (mouseEl) => {
    const ms = mouseState.get(mouseEl.dataset.id);
    return ms && ms.empoweredUntil > now;
  };
  const hasEmpoweredMouse = liveMice.some(({el}) => isEmpowered(el));

  liveMice.forEach(({ el, ms }) => {
    const mx = parseFloat(el.style.left) || 0;
    const my = parseFloat(el.style.top)  || 0;
    const mcx = mx + 45, mcy = my + 45;
    const empowered = ms.empoweredUntil > now;

    const nearestOf = (arr) => arr.reduce((acc, e) => {
      const ex = (parseFloat(e.style.left) || 0) + 45;
      const ey = (parseFloat(e.style.top)  || 0) + 45;
      const d = Math.hypot(ex - mcx, ey - mcy);
      return (!acc || d < acc.d) ? { el: e, x: ex, y: ey, d } : acc;
    }, null);

    let targetX = null, targetY = null, speed = 1.8;

    if (empowered) {
      const nr = nearestOf(robotEls);
      if (nr) { targetX = nr.x; targetY = nr.y; speed = 3.2; }
    } else if (cheeseEls.length) {
      const nc = nearestOf(cheeseEls);
      if (nc) { targetX = nc.x; targetY = nc.y; speed = 2.1; }
    } else {
      const nr = nearestOf(robotEls);
      if (nr && nr.d < 220) {
        targetX = mcx + (mcx - nr.x);
        targetY = mcy + (mcy - nr.y);
        speed = 2.8;
      }
    }

    if (targetX == null) {
      // wander
      ms.dirTimer -= dt;
      if (ms.dirTimer <= 0) {
        const a = Math.random() * Math.PI * 2;
        ms.vx = Math.cos(a) * 1.2;
        ms.vy = Math.sin(a) * 1.2;
        ms.dirTimer = 40 + Math.random() * 60;
      }
    } else {
      const dx = targetX - mcx, dy = targetY - mcy;
      const d = Math.hypot(dx, dy);
      if (d > 0.1) {
        ms.vx = (dx / d) * speed;
        ms.vy = (dy / d) * speed;
      }
    }

    let newX = mx + ms.vx * dt;
    let newY = my + ms.vy * dt;
    if (newX < 0)        { newX = 0;        ms.vx = Math.abs(ms.vx); ms.dirTimer = 0; }
    if (newX > W - 90)   { newX = W - 90;   ms.vx = -Math.abs(ms.vx); ms.dirTimer = 0; }
    if (newY < 0)        { newY = 0;        ms.vy = Math.abs(ms.vy); ms.dirTimer = 0; }
    if (newY > H - 90)   { newY = H - 90;   ms.vy = -Math.abs(ms.vy); ms.dirTimer = 0; }
    el.style.left = newX + 'px';
    el.style.top  = newY + 'px';
  });

  // mouse-cheese: empower
  liveMice.forEach(({ el, ms }) => {
    if (ms.empoweredUntil > now) return;
    const mx = (parseFloat(el.style.left) || 0) + 45;
    const my = (parseFloat(el.style.top)  || 0) + 45;
    for (const ch of cheeseEls) {
      if (!ch.isConnected || ch._eaten) continue;
      const cx = (parseFloat(ch.style.left) || 0) + 45;
      const cy = (parseFloat(ch.style.top)  || 0) + 45;
      if (Math.hypot(cx - mx, cy - my) < 60) {
        ch._eaten = true;
        ms.empoweredUntil = now + EMPOWER_MS;
        el.classList.add('empowered');
        VOICES.munch(0);
        VOICES.squeak(0.18);
        particleBurst(cx, cy, ['#fbbf24','#fde047','#a16207','#fff']);
        ch.animate(
          [{ transform: 'scale(1) rotate(0)', opacity: 1 },
           { transform: 'scale(0.2) rotate(220deg)', opacity: 0 }],
          { duration: 280, easing: 'ease-out' }
        ).onfinish = () => ch.remove();
        break;
      }
    }
  });

  // --- Robots: chase mice / carry parts / flee empowered mice ---
  const robots = obstacles.filter(o => o.kind === 'robot');
  const activeRobotIds = new Set(robots.map(r => r.el.dataset.id));
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  robots.forEach(r => {
    const id = r.el.dataset.id;
    let s = robotState.get(id);
    if (!s) {
      s = { phase: 'idle', nextAt: now + 800 + Math.random() * 1400 };
      robotState.set(id, s);
    }

    // panic: if any empowered mouse exists, drop everything and flee
    if (hasEmpoweredMouse && s.phase !== 'fleeing') {
      if (s.targetEl) { delete s.targetEl.dataset.grabbed; s.targetEl = null; }
      s.phase = 'fleeing';
    }

    if (s.phase === 'fleeing') {
      const empMouse = liveMice.find(({el}) => isEmpowered(el));
      if (!empMouse) { s.phase = 'idle'; s.nextAt = now + 400; return; }
      const rx = parseFloat(r.el.style.left) || 0;
      const ry = parseFloat(r.el.style.top)  || 0;
      const mx = parseFloat(empMouse.el.style.left) || 0;
      const my = parseFloat(empMouse.el.style.top)  || 0;
      const dx = rx - mx, dy = ry - my;
      const d = Math.hypot(dx, dy) || 1;
      const step = 2.6 * dt;
      let nx = rx + (dx / d) * step;
      let ny = ry + (dy / d) * step;
      nx = Math.max(0, Math.min(W - 90, nx));
      ny = Math.max(0, Math.min(H - 90, ny));
      r.el.style.left = nx + 'px';
      r.el.style.top  = ny + 'px';
      return;
    }

    if (s.phase === 'idle') {
      if (now < s.nextAt) return;
      // prefer non-empowered mouse if any exist
      const mouseTargets = mouseEls.filter(m => !isEmpowered(m) && !m.dataset.grabbed);
      let target = null;
      let targetIsMouse = false;
      if (mouseTargets.length) {
        target = { el: mouseTargets[Math.floor(Math.random() * mouseTargets.length)] };
        target.kind = 'mouse';
        targetIsMouse = true;
      } else {
        const candidates = obstacles.filter(o =>
          o !== r &&
          o.kind !== 'robot' &&
          o.kind !== 'mouse' &&
          o.kind !== 'cheese' &&
          o.kind !== 'lava' &&
          o.kind !== 'volcano' &&
          !o.el.dataset.grabbed
        );
        if (!candidates.length) { s.nextAt = now + 700; return; }
        target = candidates[Math.floor(Math.random() * candidates.length)];
      }
      if (targetIsMouse) {
        s.targetEl = target.el;
        s.phase = 'chasing';
        VOICES.beep(0);
        return;
      }
      target.el.dataset.grabbed = id;
      const rx = parseFloat(r.el.style.left) || 0;
      const ry = parseFloat(r.el.style.top)  || 0;
      const tx = parseFloat(target.el.style.left) || 0;
      const ty = parseFloat(target.el.style.top)  || 0;
      // approach from below so robot's claws touch the part's underside
      let destX = tx;
      let destY = ty + 70; // robot ends up just below target → they overlap a bit
      destX = Math.max(0, Math.min(W - 90, destX));
      destY = Math.max(0, Math.min(H - 90, destY));
      s.targetEl = target.el;
      s.startX = rx; s.startY = ry;
      s.destX = destX; s.destY = destY;
      const dist = Math.hypot(destX - rx, destY - ry);
      s.animStart = now;
      s.animDur = Math.max(400, Math.min(1400, dist * 2.5));
      s.phase = 'seeking';
      VOICES.beep(0);
    } else if (s.phase === 'chasing') {
      if (!s.targetEl || !s.targetEl.isConnected || isEmpowered(s.targetEl)) {
        s.phase = 'idle'; s.nextAt = now + 300; s.targetEl = null; return;
      }
      const rx = parseFloat(r.el.style.left) || 0;
      const ry = parseFloat(r.el.style.top)  || 0;
      const tx = parseFloat(s.targetEl.style.left) || 0;
      const ty = parseFloat(s.targetEl.style.top)  || 0;
      const dx = tx - rx, dy = ty - ry;
      const d = Math.hypot(dx, dy) || 1;
      const step = Math.min(2.4 * dt, d);
      r.el.style.left = (rx + (dx / d) * step) + 'px';
      r.el.style.top  = (ry + (dy / d) * step) + 'px';
      // touch is handled in the mouse-robot collision pass below
    } else if (s.phase === 'seeking') {
      if (!s.targetEl || !s.targetEl.isConnected) {
        s.phase = 'idle'; s.nextAt = now + 600; s.targetEl = null; return;
      }
      const t = Math.min(1, (now - s.animStart) / s.animDur);
      const e = ease(t);
      r.el.style.left = (s.startX + (s.destX - s.startX) * e) + 'px';
      r.el.style.top  = (s.startY + (s.destY - s.startY) * e) + 'px';
      if (t >= 1) {
        // touched! capture current target offset, pick drop spot, start carrying
        hitPart(s.targetEl, true);
        hitPart(r.el, true);
        const tx = parseFloat(s.targetEl.style.left) || 0;
        const ty = parseFloat(s.targetEl.style.top)  || 0;
        s.targetStartOX = tx - s.destX;
        s.targetStartOY = ty - s.destY;
        // pick a drop spot away from current position
        let dx, dy, tries = 0;
        do {
          dx = Math.random() * Math.max(1, W - 90);
          dy = Math.random() * Math.max(1, H - 90);
          tries++;
        } while (tries < 6 && Math.hypot(dx - s.destX, dy - s.destY) < 180);
        s.startX = s.destX; s.startY = s.destY;
        s.destX = dx; s.destY = dy;
        const dist = Math.hypot(s.destX - s.startX, s.destY - s.startY);
        s.animStart = now;
        s.animDur = Math.max(500, Math.min(1600, dist * 2.5));
        s.phase = 'carrying';
      }
    } else if (s.phase === 'carrying') {
      if (!s.targetEl || !s.targetEl.isConnected) {
        s.phase = 'idle'; s.nextAt = now + 600; s.targetEl = null; return;
      }
      const t = Math.min(1, (now - s.animStart) / s.animDur);
      const e = ease(t);
      const x = s.startX + (s.destX - s.startX) * e;
      const y = s.startY + (s.destY - s.startY) * e;
      r.el.style.left = x + 'px';
      r.el.style.top  = y + 'px';
      // smoothly lift the target onto the robot's head (offset → (0, -50)) over first half
      const liftT = Math.min(1, t * 2);
      const ox = s.targetStartOX + (0   - s.targetStartOX) * liftT;
      const oy = s.targetStartOY + (-50 - s.targetStartOY) * liftT;
      s.targetEl.style.left = (x + ox) + 'px';
      s.targetEl.style.top  = (y + oy) + 'px';
      if (t >= 1) {
        // drop it next to the robot
        s.targetEl.style.left = x + 'px';
        s.targetEl.style.top  = (y - 70) + 'px'; // place above robot, just out of overlap
        delete s.targetEl.dataset.grabbed;
        hitPart(s.targetEl, true);
        VOICES.beep(0);
        s.targetEl = null;
        s.phase = 'idle';
        s.nextAt = now + 1000 + Math.random() * 1500;
      }
    }
  });
  // release any targets held by robots that no longer exist (e.g. destroyed by fire)
  for (const [rid, rs] of robotState) {
    if (!activeRobotIds.has(rid)) {
      if (rs.targetEl) delete rs.targetEl.dataset.grabbed;
      robotState.delete(rid);
    }
  }
  // clean up state for mice that no longer exist
  const liveMouseIds = new Set(mouseEls.map(m => m.dataset.id));
  for (const mid of mouseState.keys()) {
    if (!liveMouseIds.has(mid)) mouseState.delete(mid);
  }

  // --- Mouse vs Robot collisions (eat / get eaten) ---
  for (const m of mouseEls) {
    if (!m.isConnected) continue;
    const mx = (parseFloat(m.style.left) || 0) + 45;
    const my = (parseFloat(m.style.top)  || 0) + 45;
    const ms = mouseState.get(m.dataset.id);
    const empowered = ms && ms.empoweredUntil > now;
    for (const rEl of robotEls) {
      if (!rEl.isConnected) continue;
      const rcx = (parseFloat(rEl.style.left) || 0) + 45;
      const rcy = (parseFloat(rEl.style.top)  || 0) + 45;
      if (Math.hypot(rcx - mx, rcy - my) < 60) {
        if (empowered) {
          // mouse eats robot
          particleBurst(rcx, rcy, ['#9ca3af','#ec4899','#fbbf24','#2a2118']);
          VOICES.squeak(0);
          VOICES.boom(0.05);
          rEl.animate(
            [{ transform: 'scale(1)', opacity: 1 },
             { transform: 'scale(.3) rotate(180deg)', opacity: 0 }],
            { duration: 320, easing: 'ease-out' }
          ).onfinish = () => rEl.remove();
          // food coma — mouse becomes normal again
          if (ms) ms.empoweredUntil = 0;
          m.classList.remove('empowered');
        } else {
          // robot eats mouse
          particleBurst(mx, my, ['#9ca3af','#fbcfe8','#fb7185','#fff']);
          VOICES.squeak(0);
          VOICES.munch(0.05);
          m.animate(
            [{ transform: 'scale(1)', opacity: 1 },
             { transform: 'scale(.2)', opacity: 0 }],
            { duration: 260, easing: 'ease-out' }
          ).onfinish = () => m.remove();
          mouseState.delete(m.dataset.id);
        }
        break;
      }
    }
  }

  // --- Marbles ---
  const marblesToRemove = [];
  marbles.forEach(m => {
    m.vy += GRAVITY * dt;
    m.vx *= FRICTION;
    m.vy *= FRICTION;
    m.x += m.vx * dt;
    m.y += m.vy * dt;

    if (m.x < 0)        { m.x = 0;        m.vx = Math.abs(m.vx) * 0.75; }
    if (m.x > W - 90)   { m.x = W - 90;   m.vx = -Math.abs(m.vx) * 0.75; }
    if (m.y < 0)        { m.y = 0;        m.vy = Math.abs(m.vy) * 0.75; }
    if (m.y > H - 90) {
      m.y = H - 90;
      m.vy = -Math.abs(m.vy) * 0.7;
      m.vx *= 0.9;
      if (Math.abs(m.vy) < 1.5) m.vy = 0;
    }

    const mcx = m.x + 45, mcy = m.y + 45;
    let consumed = false;
    for (const o of obstacles) {
      const dx = mcx - o.cx, dy = mcy - o.cy;
      const dist = Math.hypot(dx, dy);
      const minDist = MARBLE_RADIUS + PART_RADIUS;
      if (dist >= minDist || dist === 0) continue;

      if (o.def.lava) {
        // marble drops in lava → poof
        explodeMarble(m, ['#dc2626', '#f59e0b', '#fbbf24', '#fde047']);
        VOICES.sizzle(0);
        hitPart(o.el, true);
        consumed = true;
        break;
      }
      const overlap = minDist - dist;
      const nx = dx / dist, ny = dy / dist;
      m.x += nx * overlap;
      m.y += ny * overlap;
      const dot = m.vx * nx + m.vy * ny;
      if (dot < 0) {
        const restitution = o.def.bouncy ? 1.6 : 0.75;
        m.vx -= (1 + restitution) * dot * nx;
        m.vy -= (1 + restitution) * dot * ny;
      }
      hitPart(o.el);
    }
    if (consumed) { marblesToRemove.push(m); return; }

    // marble-marble (lightweight)
    marbles.forEach(other => {
      if (other === m || other._dead) return;
      const dx = (m.x + 45) - (other.x + 45);
      const dy = (m.y + 45) - (other.y + 45);
      const dist = Math.hypot(dx, dy);
      const minDist = MARBLE_RADIUS * 2;
      if (dist < minDist && dist > 0) {
        const overlap = (minDist - dist) / 2;
        const nx = dx / dist, ny = dy / dist;
        m.x += nx * overlap;     m.y += ny * overlap;
        other.x -= nx * overlap; other.y -= ny * overlap;
        const dvx = m.vx - other.vx, dvy = m.vy - other.vy;
        const dot = dvx * nx + dvy * ny;
        if (dot < 0) {
          m.vx -= dot * nx;     m.vy -= dot * ny;
          other.vx += dot * nx; other.vy += dot * ny;
        }
      }
    });

    m.el.style.left = m.x + "px";
    m.el.style.top  = m.y + "px";
  });
  marblesToRemove.forEach(m => { m._dead = true; });
  marbles = marbles.filter(m => !m._dead);

  // --- Fireballs ---
  const fireballsToRemove = [];
  fireballs.forEach(f => {
    f.vy += GRAVITY * 0.6 * dt;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.life -= dt;

    // wall: bottom kills, sides bounce (so they don't fly off)
    if (f.x < 0)        { f.x = 0;     f.vx = Math.abs(f.vx) * 0.6; }
    if (f.x > W)        { f.x = W;     f.vx = -Math.abs(f.vx) * 0.6; }
    if (f.y > H + 20 || f.life <= 0) { fireballsToRemove.push(f); return; }

    for (const o of obstacles) {
      if (o.def.fireproof) continue; // volcano / lava aren't burned
      const dx = f.x - o.cx, dy = f.y - o.cy;
      const dist = Math.hypot(dx, dy);
      if (dist < FIREBALL_RADIUS + PART_RADIUS - 6) {
        destroyByFire(o.el);
        // remove from local obstacle list so the next fireball doesn't hit ghost
        const i = obstacles.indexOf(o); if (i >= 0) obstacles.splice(i, 1);
        fireballsToRemove.push(f);
        break;
      }
    }
    // also kill marbles
    if (!fireballsToRemove.includes(f)) {
      for (const m of marbles) {
        if (m._dead) continue;
        const dx = f.x - (m.x + 45), dy = f.y - (m.y + 45);
        if (Math.hypot(dx, dy) < FIREBALL_RADIUS + MARBLE_RADIUS - 4) {
          explodeMarble(m, ['#dc2626', '#fbbf24', '#7c2d12']);
          m._dead = true;
          fireballsToRemove.push(f);
          break;
        }
      }
    }

    f.el.style.left = f.x + "px";
    f.el.style.top  = f.y + "px";
  });
  fireballsToRemove.forEach(f => f.el.remove());
  fireballs = fireballs.filter(f => !fireballsToRemove.includes(f));
  marbles = marbles.filter(m => !m._dead);

  physicsHandle = requestAnimationFrame(physicsLoop);
}

function eruptVolcano(v) {
  const n = 3 + Math.floor(Math.random() * 3);
  const cx = v.cx, cy = v.cy - 22;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'fireball';
    el.style.left = cx + 'px';
    el.style.top  = cy + 'px';
    world.appendChild(el);
    fireballs.push({
      el, x: cx, y: cy,
      vx: (Math.random() - 0.5) * 8,
      vy: -9 - Math.random() * 4,
      life: 200
    });
  }
  // visual shake on the volcano itself
  v.el.animate(
    [{ transform: 'translate(0,0)' }, { transform: 'translate(-4px,2px)' }, { transform: 'translate(4px,-2px)' }, { transform: 'translate(0,0)' }],
    { duration: 200 }
  );
  VOICES.boom(0);
}

function explodeMarble(m, colors) {
  particleBurst(m.x + 45, m.y + 45, colors || ['#dc2626','#fbbf24']);
  if (m.el) {
    m.el.animate(
      [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(0.2)', opacity: 0 }],
      { duration: 220, easing: 'ease-out' }
    ).onfinish = () => m.el.remove();
  }
}

function destroyByFire(el) {
  if (!el.parentNode) return;
  const r = el.getBoundingClientRect();
  const wr = world.getBoundingClientRect();
  particleBurst((r.left - wr.left) / worldScale + 45, (r.top - wr.top) / worldScale + 45, ['#dc2626','#fbbf24','#7c2d12','#451a03']);
  el.animate(
    [{ transform: 'scale(1) rotate(0)', opacity: 1, filter: 'brightness(1)' },
     { transform: 'scale(1.3) rotate(30deg)', opacity: 0, filter: 'brightness(3) sepia(1)' }],
    { duration: 350, easing: 'ease-out' }
  ).onfinish = () => el.remove();
  VOICES.boom(0);
}

function particleBurst(cx, cy, colors) {
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = cx + 'px';
    p.style.top  = cy + 'px';
    p.style.background = colors[i % colors.length];
    world.appendChild(p);
    const angle = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
    const dist = 40 + Math.random() * 50;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 10;
    p.animate(
      [{ transform: 'translate(0,0) scale(1)', opacity: 1 },
       { transform: `translate(${dx}px, ${dy}px) scale(.3)`, opacity: 0 }],
      { duration: 520 + Math.random() * 200, easing: 'ease-out' }
    ).onfinish = () => p.remove();
  }
}

const HIT_COOLDOWN = {};
function hitPart(el, force = false) {
  const id = el.dataset.id;
  const now = performance.now();
  if (!force && HIT_COOLDOWN[id] && now - HIT_COOLDOWN[id] < 250) return;
  HIT_COOLDOWN[id] = now;
  el.classList.add("hit");
  setTimeout(() => el.classList.remove("hit"), 260);
  const v = VOICES[PARTS[el.dataset.kind].voice];
  if (v) v(0);
}

const countEl = document.getElementById("count");
function updateCount() {
  const n = shop.querySelectorAll(".part").length;
  countEl.textContent = n + (n === 1 ? " onderdeel" : " onderdelen");
  shop.classList.toggle("has-parts", n > 0);
}

const ADJ  = ["Machtige","Wiebelende","Geschifte","Mega","Turbo","Stiekeme","Krokante","Drassige","Galactische","Kosmische","Stinkende","Wilde","Pluizige","Quantum","Atomische","Vulkanische","Smeltende"];
const NOUN = ["Dingetje","Apparaatje","Vehikel","Gadget","Constructie","Machine","Wiebelaar","Draaier","Vermorzelaar","Toeteraar","Toeter","O-Matic","Motor","Uitbarster"];
const SUFFIX = ["2000","3000","5000","XL","Pro","Mark II","Mark VII","Deluxe","Supreme","9001"];
function generateName(partsUsed) {
  const a = ADJ[Math.floor(Math.random()*ADJ.length)];
  const n = NOUN[Math.floor(Math.random()*NOUN.length)];
  const s = SUFFIX[Math.floor(Math.random()*SUFFIX.length)];
  if (partsUsed.length && Math.random() < 0.6) {
    const featured = PARTS[partsUsed[Math.floor(Math.random()*partsUsed.length)]].name;
    return `De ${a} ${featured}-${n} ${s}!`;
  }
  return `De ${a} ${n} ${s}!`;
}

// ============================================================================
// AUTOSAVE + HISTORY
// ============================================================================
const STORE_CURRENT = "machinegame:current";
const STORE_HISTORY = "machinegame:history";
const MAX_HISTORY = 30;

let history = [];
let lastSnapJson = null;
let runtimeBackup = null; // parts list captured at run-start; restored on stop

function snapshot() {
  return {
    t: Date.now(),
    parts: [...shop.querySelectorAll(".part")].map(el => ({
      kind: el.dataset.kind,
      x: parseFloat(el.style.left) || 0,
      y: parseFloat(el.style.top)  || 0
    }))
  };
}

function applySnapshot(snap, opts = {}) {
  shop.querySelectorAll(".part").forEach(el => el.remove());
  (snap.parts || []).forEach(p => {
    if (!p || !(p.kind in PARTS)) return; // backwards-compat: silently drop unknown kinds
    spawnPartLocal(p.kind, +p.x || 0, +p.y || 0, { silent: true });
  });
  updateCount();
  if (!opts.silent) saveCurrent();
}

function saveCurrent() {
  try { localStorage.setItem(STORE_CURRENT, JSON.stringify(snapshot())); } catch (e) {}
}
function saveHistory() {
  try { localStorage.setItem(STORE_HISTORY, JSON.stringify(history)); } catch (e) {}
}

function saveAndPush() {
  if (document.body.classList.contains("running")) return;
  const snap = snapshot();
  const json = JSON.stringify(snap);
  if (json === lastSnapJson) return;
  if (lastSnapJson !== null) {
    history.push(JSON.parse(lastSnapJson));
    if (history.length > MAX_HISTORY) history.shift();
    saveHistory();
    renderHistory();
  }
  lastSnapJson = json;
  saveCurrent();
}

function loadInitial() {
  try {
    const h = localStorage.getItem(STORE_HISTORY);
    if (h) history = JSON.parse(h);
  } catch (e) { history = []; }
  let cur = null;
  try {
    const c = localStorage.getItem(STORE_CURRENT);
    if (c) cur = JSON.parse(c);
  } catch (e) {}
  if (cur && cur.parts && cur.parts.length) {
    applySnapshot(cur, { silent: true });
  }
  lastSnapJson = JSON.stringify(snapshot());
  renderHistory();
}

function undo() {
  if (document.body.classList.contains("running")) return;
  if (!history.length) return;
  const prev = history.pop();
  applySnapshot(prev, { silent: true });
  lastSnapJson = JSON.stringify(snapshot());
  saveCurrent();
  saveHistory();
  renderHistory();
  tone({ freq: 600, type: "triangle", dur: .1, vol: .12, slide: -200 });
}

// History panel
const historyPanel = document.getElementById("historyPanel");
const historyList  = document.getElementById("historyList");
const historyBtn   = document.getElementById("historyBtn");
const historyClose = document.getElementById("historyClose");
historyBtn.addEventListener("click", () => historyPanel.classList.toggle("open"));
historyClose.addEventListener("click", () => historyPanel.classList.remove("open"));

function renderHistory() {
  const undoBtn = document.getElementById("undoBtn");
  if (undoBtn) undoBtn.disabled = history.length === 0;

  historyList.innerHTML = "";
  if (!history.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Nog niets — begin met bouwen en je geschiedenis komt hier.";
    historyList.appendChild(empty);
    return;
  }
  for (let i = history.length - 1; i >= 0; i--) {
    const snap = history[i];
    const li = document.createElement("li");
    const stepNum = i + 1;
    li.innerHTML = `
      <div>
        <div class="step">Stap ${stepNum}</div>
        <div class="info">${snap.parts.length} ${snap.parts.length === 1 ? "onderdeel" : "onderdelen"} • ${timeAgo(snap.t)}</div>
      </div>
      <div style="font-size:18px">↶</div>`;
    li.addEventListener("click", () => {
      const target = history[i];
      history = history.slice(0, i);
      applySnapshot(target, { silent: true });
      lastSnapJson = JSON.stringify(snapshot());
      saveCurrent(); saveHistory(); renderHistory();
      historyPanel.classList.remove("open");
      tone({ freq: 800, type: "triangle", dur: .12, vol: .12, slide: -100 });
    });
    historyList.appendChild(li);
  }
}
function timeAgo(t) {
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 5) return "net";
  if (s < 60) return s + "s geleden";
  if (s < 3600) return Math.floor(s / 60) + "m geleden";
  if (s < 86400) return Math.floor(s / 3600) + "u geleden";
  return Math.floor(s / 86400) + "d geleden";
}

// ============================================================================
// EXPORT / IMPORT (build codes — backwards compatible)
// ============================================================================
// Format: "MMW1:" + base64( JSON({ v:1, parts:[{kind,x,y}, ...] }) )
// Loaders silently drop unknown kinds, so:
//   - old codes loaded in new pages: work (all known kinds load)
//   - new codes loaded in old pages: work (unknown kinds skipped)

function exportBuild() {
  const data = { v: 1, parts: snapshot().parts };
  return "MMW1:" + btoa(JSON.stringify(data));
}

function importBuild(str) {
  if (typeof str !== "string") return { ok: false, msg: "Lege code." };
  str = str.trim();
  if (!str) return { ok: false, msg: "Plak eerst een code!" };

  let data = null;
  try {
    if (/^MMW\d+:/.test(str)) {
      const b64 = str.split(":").slice(1).join(":");
      data = JSON.parse(atob(b64));
    } else {
      try { data = JSON.parse(str); }
      catch { data = JSON.parse(atob(str)); }
    }
  } catch (e) {
    return { ok: false, msg: "Dat lijkt geen Werkplaats-code." };
  }
  if (!data || !Array.isArray(data.parts)) {
    return { ok: false, msg: "Code mist de onderdelenlijst." };
  }

  const validParts = data.parts.filter(p => p && typeof p.kind === "string" && p.kind in PARTS);
  const skipped = data.parts.length - validParts.length;

  applySnapshot({ parts: validParts });
  saveAndPush();

  let msg = `${validParts.length} ${validParts.length === 1 ? "onderdeel" : "onderdelen"} geladen!`;
  if (skipped > 0) msg += ` (${skipped} onbekend${skipped === 1 ? "" : "e"} overgeslagen)`;
  return { ok: true, msg };
}

const runBtn      = document.getElementById("runBtn");
const clearBtn    = document.getElementById("clearBtn");
const machineName = document.getElementById("machineName");
const surpriseBtn = document.getElementById("surpriseBtn");
const soundBtn    = document.getElementById("soundBtn");
const undoBtn     = document.getElementById("undoBtn");

let runInterval = null;

runBtn.addEventListener("click", () => {
  if (document.body.classList.contains("running")) stop();
  else run();
});

function run() {
  const parts = [...shop.querySelectorAll(".part")];
  if (!parts.length) {
    machineName.textContent = "...bouw eerst iets, gekkie!";
    return;
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  ac();

  // Capture pre-run state so destroyed parts come back when we stop
  runtimeBackup = parts.map(el => ({
    kind: el.dataset.kind,
    x: parseFloat(el.style.left) || 0,
    y: parseFloat(el.style.top)  || 0
  }));

  document.body.classList.add("running");
  runBtn.textContent = "■ STOP!";
  runBtn.classList.add("is-running");
  historyPanel.classList.remove("open");
  modalBackdrop.hidden = true;

  machineName.textContent = generateName(parts.map(p => p.dataset.kind));

  parts.forEach(el => {
    if (el.dataset.kind !== "marble") el.classList.add("active");
    const train = el.querySelector("[data-train]");
    if (train) {
      train.style.opacity = "1";
      train.style.animation = "train-ride 1.4s linear infinite";
    }
  });

  const chorus = () => {
    [...shop.querySelectorAll(".part")].forEach((p, i) => {
      if (p.dataset.kind === "marble") return;
      const v = VOICES[PARTS[p.dataset.kind].voice];
      if (v) v(i * 0.12);
    });
  };
  chorus();
  runInterval = setInterval(chorus, 2500);

  startPhysics();
}

function stop() {
  document.body.classList.remove("running");
  runBtn.textContent = "▶ START!";
  runBtn.classList.remove("is-running");
  if (runInterval) { clearInterval(runInterval); runInterval = null; }
  shop.querySelectorAll(".part").forEach(el => el.classList.remove("active", "hit"));
  shop.querySelectorAll("[data-train]").forEach(t => {
    t.style.opacity = "0"; t.style.animation = "none";
  });
  stopPhysics();
  // Restore any destroyed/lost parts from the pre-run backup
  if (runtimeBackup) {
    shop.querySelectorAll(".part").forEach(el => el.remove());
    runtimeBackup.forEach(p => spawnPartLocal(p.kind, p.x, p.y, { silent: true }));
    updateCount();
    runtimeBackup = null;
  }
}

clearBtn.addEventListener("click", () => {
  const parts = [...shop.querySelectorAll(".part")];
  if (!parts.length && !document.body.classList.contains("running")) return;
  stop();
  const remaining = [...shop.querySelectorAll(".part")];
  remaining.forEach(p => {
    const r = p.getBoundingClientRect();
    const wr = world.getBoundingClientRect();
    for (let i = 0; i < 6; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = ((r.left - wr.left) / worldScale + 40) + "px";
      c.style.top  = ((r.top  - wr.top)  / worldScale + 40) + "px";
      c.style.background = ["#ef4444","#f59e0b","#10b981","#3b82f6","#8b5cf6","#ec4899"][i%6];
      world.appendChild(c);
      const dx = (Math.random() - .5) * 200;
      const dy = (Math.random() - .5) * 200;
      c.animate(
        [{ transform: "translate(0,0) rotate(0)", opacity: 1 },
         { transform: `translate(${dx}px, ${dy}px) rotate(720deg)`, opacity: 0 }],
        { duration: 700, easing: "ease-out" }
      ).onfinish = () => c.remove();
    }
    p.remove();
  });
  updateCount();
  tone({ freq: 300, type:"square", dur:.15, vol:.2, slide: -200 });
  machineName.textContent = "naamloze machine";
  saveAndPush();
});

surpriseBtn.addEventListener("click", () => {
  if (document.body.classList.contains("running")) return;
  const kinds = Object.keys(PARTS).filter(k => !PARTS[k].hidden);
  const n = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    spawnInShopRandom(kinds[Math.floor(Math.random() * kinds.length)]);
  }
  tone({ freq: 700, type: "triangle", dur: .15, vol: .15, slide: 400 });
});

    { count: 14, w: 36, h: 70, fx: '', svg: `<svg viewBox="0 0 36 70" xmlns="http://www.w3.org/2000/svg"><rect x="13" y="12" width="10" height="58" fill="#78350f" stroke="#451a03" stroke-width="2"/><polygon points="13,12 23,12 18,4" fill="#451a03"/><rect x="0" y="30" width="36" height="5" fill="#78350f" stroke="#451a03" stroke-width="1.5"/><rect x="0" y="50" width="36" height="5" fill="#78350f" stroke="#451a03" stroke-width="1.5"/></svg>` }
  ],
  ice: [
    { count: 30, w: 36, h: 36, fx: 'twinkle', svg: `<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><g stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"><line x1="18" y1="3" x2="18" y2="33"/><line x1="3" y1="18" x2="33" y2="18"/><line x1="7.5" y1="7.5" x2="28.5" y2="28.5"/><line x1="28.5" y1="7.5" x2="7.5" y2="28.5"/></g></svg>` },
    { count: 12, w: 36, h: 60, fx: '', svg: `<svg viewBox="0 0 36 60" xmlns="http://www.w3.org/2000/svg"><path d="M 6 0 L 18 60 L 30 0 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/><path d="M 14 6 L 18 36" stroke="#fff" stroke-width="2" opacity=".7"/></svg>` }
  ],
  workshop: [
    { count: 14, w: 60, h: 60, fx: '', svg: `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="22" fill="none" stroke="rgba(120,90,40,.25)" stroke-width="3" stroke-dasharray="6 6"/><circle cx="30" cy="30" r="6" fill="rgba(120,90,40,.25)"/></svg>` }
  ]
};

function applyTheme(key) {
  const t = THEMES[key] || THEMES.workshop;
  world.style.backgroundColor = t.bg;
  world.style.backgroundImage = t.pattern;
  world.style.backgroundSize = t.patternSize || 'auto';
  document.body.dataset.theme = key;
  try { localStorage.setItem('machinegame:theme', key); } catch (_) {}
  // refresh decorations
  world.querySelectorAll('.deco').forEach(el => el.remove());
  const decos = DECORATIONS[key];
  if (decos) {
    const firstPart = world.querySelector('.part');
    decos.forEach(d => {
      for (let i = 0; i < d.count; i++) {
        const el = document.createElement('div');
        el.className = 'deco' + (d.fx ? ' ' + d.fx : '');
        el.innerHTML = d.svg;
        el.style.left   = Math.floor(Math.random() * (WORLD_W - d.w)) + 'px';
        el.style.top    = Math.floor(Math.random() * (WORLD_H - d.h)) + 'px';
        el.style.width  = d.w + 'px';
        el.style.height = d.h + 'px';
        el.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
        world.insertBefore(el, firstPart || null);
      }
    });
  }
}

const mapBackdrop = document.getElementById('mapBackdrop');
const mapGrid = document.getElementById('mapGrid');
const mapClose = document.getElementById('mapClose');
const mapBtn = document.getElementById('mapBtn');

function showMapSelect(allowClose) {
  mapGrid.innerHTML = '';
  for (const [key, t] of Object.entries(THEMES)) {
    const card = document.createElement('div');
    card.className = 'map-card';
    card.innerHTML =
      `<span class="emoji">${t.emoji}</span>${t.name}` +
      `<span class="swatch" style="background:${t.bg}"></span>`;
    card.addEventListener('click', () => {
      applyTheme(key);
      mapBackdrop.hidden = true;
    });
    mapGrid.appendChild(card);
  }
  mapClose.hidden = !allowClose;
  mapBackdrop.hidden = false;
}
mapClose.addEventListener('click', () => { mapBackdrop.hidden = true; });
mapBtn.addEventListener('click', () => showMapSelect(true));

// ============================================================================
// INIT
// ============================================================================
const savedTheme = (() => { try { return localStorage.getItem('machinegame:theme'); } catch (_) { return null; }})();
if (savedTheme && THEMES[savedTheme]) {
  applyTheme(savedTheme);
} else {
  applyTheme('workshop');
  showMapSelect(false);
}
loadInitial();
// center the world horizontally in the viewport at start
requestAnimationFrame(() => {
  const sr = shop.getBoundingClientRect();
  worldX = Math.min(0, (sr.width  - WORLD_W) / 2);
  worldY = Math.min(0, (sr.height - WORLD_H) / 2);
  clampWorld();
  setWorldTransform();
});
</script>
